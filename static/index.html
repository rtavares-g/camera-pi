<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Câmera</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd;
               font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #video { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  img { max-width: 100%; max-height: 100%; }
  #barra { display: flex; justify-content: space-between; padding: 6px 12px;
           font-size: 13px; background: #000; }
  .on { color: #4caf50; } .off { color: #f44336; }
</style>
</head>
<body>
<div id="video"><img id="img" alt="Câmera"></div>
<div id="barra"><span id="estado" class="off">conectando…</span><span id="fps"></span></div>
<script>
const img = document.getElementById('img');
const estado = document.getElementById('estado');
const fpsEl = document.getElementById('fps');
let url = null, frames = 0;

setInterval(() => { fpsEl.textContent = frames + ' fps'; frames = 0; }, 1000);

function conectar() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}${location.pathname.replace(/\/$/, '')}/ws`);
  ws.binaryType = 'blob';
  ws.onopen = () => { estado.textContent = 'ao vivo'; estado.className = 'on'; };
  ws.onmessage = (ev) => {
    const novo = URL.createObjectURL(ev.data);
    img.onload = () => { if (url) URL.revokeObjectURL(url); url = novo; };
    img.src = novo;
    frames++;
  };
  ws.onclose = () => {
    estado.textContent = 'desconectado — reconectando…'; estado.className = 'off';
    setTimeout(conectar, 2000);
  };
}
conectar();
</script>
</body>
</html>
