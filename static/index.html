<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Câmera</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd;
               font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #area { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  video { max-width: 100%; max-height: 100%; background: #000; }
  #barra { display: flex; justify-content: space-between; padding: 6px 12px;
           font-size: 13px; background: #000; }
  .on { color: #4caf50; } .off { color: #f44336; }
  nav { display: flex; gap: 4px; padding: 8px 12px; background: #000; }
  nav a { color: #888; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 14px; }
  nav a.atual { color: #fff; background: #222; }
  #b-priv { margin-left: auto; background: #333; border: 1px solid #444; color: #ddd; padding: 6px 10px;
            border-radius: 6px; cursor: pointer; font-size: 14px; }
  #b-priv.ativo { background: #f44336; border-color: #f44336; color: #fff; }
</style>
</head>
<body>
<nav>
  <a href="./" class="atual">Ao vivo</a>
  <a href="gravacoes">Gravações</a>
  <button id="b-priv" title="Desligar câmera e gravação">🔒 Privacidade</button>
</nav>
<div id="area"><video id="video" autoplay muted playsinline></video></div>
<div id="barra"><span id="estado" class="off">conectando…</span><span id="info"></span></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
// Vídeo H.264 via HLS do MediaMTX (repassado pelo camera-pi em /cam/).
const video = document.getElementById('video');
const estado = document.getElementById('estado');
const info = document.getElementById('info');
const src = location.pathname.replace(/\/$/, '') + '/cam/index.m3u8';

function marcar(texto, ok) { estado.textContent = texto; estado.className = ok ? 'on' : 'off'; }

video.addEventListener('playing', () => marcar('ao vivo', true));
video.addEventListener('waiting', () => marcar('carregando…', false));
setInterval(async () => {
  if (video.videoWidth) info.textContent = `${video.videoWidth}×${video.videoHeight}`;
  try {
    const r = await fetch('api/estado');
    if (r.ok) {
      const est = await r.json();
      document.getElementById('b-priv').className = est.config.privacidade ? 'ativo' : '';
    }
  } catch {}
}, 2000);
document.getElementById('b-priv').onclick = async () => {
  try {
    await fetch('api/privacidade', { method: 'POST', 
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ativo: !document.getElementById('b-priv').classList.contains('ativo') })
    });
  } catch {}
};

function conectar() {
  marcar('conectando…', false);
  if (window.Hls && Hls.isSupported()) {
    const hls = new Hls({ lowLatencyMode: true, liveSyncDurationCount: 2 });
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      marcar('desconectado — reconectando…', false);
      hls.destroy();
      setTimeout(conectar, 2000);
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari / iOS: HLS nativo
    video.src = src;
    video.onerror = () => { marcar('desconectado — reconectando…', false); setTimeout(conectar, 2000); };
  } else {
    marcar('navegador sem suporte a HLS', false);
  }
  video.play().catch(() => {});
}
conectar();
</script>
</body>
</html>
