# MediaMTX - camera do Raspberry Pi (ov5647) para o painel camera-quarto
# (HLS, via camera-pi), para o Home Assistant (RTSP; Alexa/Google pelo HA)
# e para a gravação por movimento (buffer em RAM + RTSP local, via camera-pi).
# Só o que difere do padrão do MediaMTX está aqui.

logLevel: info

# Servidores HTTP só no localhost: o painel chega pelo camera-pi
# (Cloudflare Tunnel + Access).
# RTSP na rede local: o detector de movimento do camera-pi lê pelo
# localhost e o Home Assistant pela rede, com usuário e senha próprios
# (ver authInternalUsers; o install.sh preenche os __HA_...__).
rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: false
srt: false
moq: false

# API só no localhost: o camera-pi consulta quem está assistindo para
# acender o LED da câmera.
api: true
apiAddress: 127.0.0.1:9997

# Localhost pode tudo (camera-pi: detector, HLS do painel, API do LED).
# O Home Assistant só lê o path "cam", só do IP dele e com senha.
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics
      - action: pprof
  - user: __HA_RTSP_USUARIO__
    pass: __HA_RTSP_SENHA__
    ips: ['__HA_IP__']
    permissions:
      - action: read
        path: cam

hls: true
hlsAddress: 127.0.0.1:8888
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

# WebRTC era só para a Sinric (Alexa/Google); agora eles chegam pelo
# Home Assistant, que lê por RTSP.
webrtc: false

paths:
  cam:
    source: rpiCamera
    # Câmera sempre ligada: o detector de movimento precisa dela.
    sourceOnDemand: no
    rpiCameraWidth: 1280
    rpiCameraHeight: 720
    rpiCameraFPS: 20
    # IDR a cada 1 s (= FPS): segmentos HLS curtos e início rápido.
    rpiCameraIDRPeriod: 20
    rpiCameraBitrate: 2000000
    rpiCameraH264Profile: baseline
    # Grava sem parar em segmentos curtos num buffer em RAM; o camera-pi
    # move para o disco só os que têm movimento (com pré-gravação) e apaga
    # o resto. Assim o cartão SD não sofre com gravação contínua.
    record: yes
    recordPath: /dev/shm/camera-pi/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 5s
    # Quem apaga é o camera-pi.
    recordDeleteAfter: 0s
