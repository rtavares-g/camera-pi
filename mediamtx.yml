# MediaMTX - camera do Raspberry Pi (ov5647) para o painel camera-quarto
# (HLS, via camera-pi), para Alexa/Google Home (WebRTC, via Sinric Pro) e
# para a gravação por movimento (buffer em RAM + RTSP local, via camera-pi).
# Só o que difere do padrão do MediaMTX está aqui.

logLevel: info

# Servidores HTTP só no localhost: o painel chega pelo camera-pi
# (Cloudflare Tunnel + Access) e a Sinric pelo camera-pi (WHEP).
# RTSP só no localhost: o detector de movimento do camera-pi lê por aqui.
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]
rtmp: false
srt: false
moq: false

# API só no localhost: o camera-pi consulta quem está assistindo para
# acender o LED da câmera (o padrão já libera a API só para 127.0.0.1).
api: true
apiAddress: 127.0.0.1:9997

hls: true
hlsAddress: 127.0.0.1:8888
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: true
webrtcAddress: 127.0.0.1:8889
# O vídeo WebRTC em si vai direto por UDP para o Echo Show / app,
# então esta porta precisa ser alcançável na rede local.
webrtcLocalUDPAddress: :8189
# Só a rede cabeada (wlan0 é outra rede e lo não serve para ninguém).
webrtcIPsFromInterfacesList: [eth0]
# Sem STUN de propósito: o candidato srflx do MediaMTX sai de um socket
# separado (porta aleatória, fora do 8189) e confunde a escolha do caminho
# com o servidor da Amazon. O Pi já manda checks pela 8189 e o roteador
# preserva a porta, então a Amazon aprende o endereço público sozinha.

paths:
  cam:
    source: rpiCamera
    # Câmera sempre ligada: o detector de movimento precisa dela.
    sourceOnDemand: no
    rpiCameraWidth: 1280
    rpiCameraHeight: 720
    rpiCameraFPS: 20
    # IDR a cada 1 s (= FPS): segmentos HLS curtos e início rápido.
    rpiCameraIDRPeriod: 20
    rpiCameraBitrate: 2000000
    rpiCameraH264Profile: baseline
    # Grava sem parar em segmentos curtos num buffer em RAM; o camera-pi
    # move para o disco só os que têm movimento (com pré-gravação) e apaga
    # o resto. Assim o cartão SD não sofre com gravação contínua.
    record: yes
    recordPath: /dev/shm/camera-pi/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordPartDuration: 1s
    recordSegmentDuration: 5s
    # Quem apaga é o camera-pi.
    recordDeleteAfter: 0s
